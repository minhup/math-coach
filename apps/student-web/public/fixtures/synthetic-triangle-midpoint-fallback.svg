<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title description">
  <title id="title">Synthetic coordinate triangle and midpoint</title>
  <desc id="description">Triangle ABC with horizontal base AB, midpoint M, and a dashed median from C to M.</desc>
  <rect width="960" height="640" rx="28" fill="#fffdf7"/>
  <g stroke="#d8ded8" stroke-width="2">
    <path d="M100 80V560M220 80V560M340 80V560M460 80V560M580 80V560M700 80V560M820 80V560"/>
    <path d="M80 120H880M80 240H880M80 360H880M80 480H880"/>
  </g>
  <path d="M150 500L780 500L360 130Z" fill="#dff1eb" fill-opacity=".65" stroke="#176b68" stroke-width="8"/>
  <path d="M360 130L465 500" fill="none" stroke="#e86945" stroke-dasharray="16 12" stroke-width="7"/>
  <g fill="#18343b" font-family="system-ui, sans-serif" font-size="32" font-weight="700">
    <circle cx="150" cy="500" r="12" fill="#176b68"/><text x="115" y="548">A</text>
    <circle cx="780" cy="500" r="12" fill="#176b68"/><text x="790" y="548">B</text>
    <circle cx="360" cy="130" r="12" fill="#176b68"/><text x="325" y="105">C</text>
    <circle cx="465" cy="500" r="13" fill="#e86945"/><text x="445" y="548">M</text>
  </g>
</svg>
