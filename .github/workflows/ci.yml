name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 24.14.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.12"
      - name: Install uv
        run: python -m pip install uv==0.11.30
      - name: Install dependencies and start services
        run: make setup
      - name: Run the review checks
        env:
          CI: "true"
        run: make check
