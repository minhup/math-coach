name: math-coach

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: math_coach
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-math_coach_dev}
      POSTGRES_USER: ${POSTGRES_USER:-math_coach}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-test-database.sql:ro

  object-storage:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-http://localhost:3000}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-object-storage-only}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-math_coach_dev}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - object-storage-data:/data

volumes:
  object-storage-data:
  postgres-data:
