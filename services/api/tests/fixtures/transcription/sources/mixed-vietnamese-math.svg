<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
  <rect width="900" height="1200" fill="#fffdf7"/>
  <text x="48" y="72" fill="#a13f35" font-family="sans-serif" font-size="24" font-weight="700">SYNTHETIC TEST FIXTURE — NO PERSON</text>
  <g fill="#18343b" font-family="Comic Sans MS, cursive" font-size="43">
    <text x="70" y="200">Gọi M là trung điểm của AB.</text>
    <text x="95" y="330">M = ((x₁ + x₂)/2, (y₁ + y₂)/2)</text>
    <text x="70" y="480">Thay A(1, 2), B(5, 4), ta có</text>
    <text x="105" y="620">M = (3, 3).</text>
    <text x="70" y="770">Vậy tọa độ trung điểm là M(3, 3).</text>
  </g>
</svg>
