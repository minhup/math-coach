<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
  <rect width="900" height="1200" fill="#fffdf7"/>
  <text x="48" y="72" fill="#a13f35" font-family="sans-serif" font-size="24" font-weight="700">SYNTHETIC TEST FIXTURE — NO PERSON</text>
  <g stroke="#18343b" stroke-width="5" fill="none">
    <path d="M180 500 L450 170 L740 500 Z"/>
    <path d="M450 170 L460 500" stroke-dasharray="12 10"/>
  </g>
  <g fill="#18343b" font-family="Comic Sans MS, cursive" font-size="38">
    <text x="430" y="145">A</text><text x="140" y="540">B</text><text x="750" y="540">C</text><text x="470" y="535">M</text>
    <text x="75" y="675">M is the midpoint of BC, so BM = MC.</text>
    <text x="105" y="800">AM² + BM² = AB²</text>
  </g>
</svg>
